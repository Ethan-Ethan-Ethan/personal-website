# recipe-runtime-binding.v1.yaml — Recipe→site-system 綁定表契約（Task 6）
# 上游：website-recipe.v1.schema.yaml＋Task 2 recipe_hash（scene/visual/motion 語意層）
# 規則：缺值一律降級靜態可讀頁，絕不猜測補值。本 Task 不改 components/CSS/Three.js。
version: "1"
bindings:
  - {recipe: "scene.id", runtime: "route key", type: "string", unknown: "拒絕渲染（staticFallback=true）"}
  - {recipe: "visual.palette", runtime: "cssVars", type: "hex[]", via: "palette-hex-map.v1.yaml", unknown: "預設灰階 #6b7280＋staticFallback=true"}
  - {recipe: "visual.hotspot", runtime: "hotspots (SVG x,y,r)", type: "array", unknown: "隱藏熱區（空陣列）"}
  - {recipe: "motion.loop", runtime: "animate", type: "boolean", unknown: "視為 false"}
