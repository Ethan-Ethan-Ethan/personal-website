benchmark: personal-website-site-system
version: 3
title: Site System YAML deterministic 結構與安全契約
pass_threshold: 1.0
items:
  - { id: R01, description: 版本固定, assertion: yaml_path, path: version, equals: "1", weight: 1 }
  - { id: R02, description: 系統 ID, assertion: yaml_path, path: system.id, equals: personal-website, weight: 1 }
  - { id: R03, description: generated TypeScript 路徑固定且位於專案內, assertion: yaml_path, path: system.generated_types, equals: src/generated/site-system.ts, weight: 2 }
  - { id: R04, description: Galaxy component, assertion: yaml_path, path: elements.galaxy.component, equals: GalaxyCanvas, weight: 1 }
  - { id: R05, description: Galaxy integer layer, assertion: yaml_path, path: elements.galaxy.layer, regex: '^(?:0|[1-9][0-9]*)$', weight: 1 }
  - { id: R06, description: Galaxy responsive metadata, assertion: yaml_path, path: elements.galaxy.responsive, exists: true, weight: 1 }
  - { id: R07, description: Galaxy motion metadata, assertion: yaml_path, path: elements.galaxy.motion, exists: true, weight: 1 }
  - { id: R08, description: Galaxy reduced-motion metadata, assertion: yaml_path, path: elements.galaxy.reduced_motion, exists: true, weight: 1 }
  - { id: R09, description: 必須包含 about content section, assertion: regex_matches, pattern: '(?m)^\s*sections:\s*\[projects, ai-lab, trading-lab, about, articles\]\s*$', weight: 2 }
  - { id: R10, description: command.list 正式存在, assertion: yaml_path, path: commands.command.list.owner, equals: site-shell, weight: 2 }
  - { id: R11, description: RSS dry-run 契約, assertion: yaml_path, path: commands.rss.run.input.dry-run, equals: boolean, weight: 2 }
  - { id: R12, description: verify-all command, assertion: yaml_path, path: verification.commands.verify-all, exists: true, weight: 1 }
  - { id: R13, description: 無本機絕對路徑, assertion: regex_matches, pattern: '(?s)\A(?!.*\/(?:Users|home|private|var|Volumes|tmp|etc)\/).*\Z', weight: 2 }
  - { id: R14, description: 無 parent-directory traversal, assertion: not_contains_text, text: "../", weight: 2 }
  - { id: R15, description: 無未宣告 secret 欄位, assertion: regex_matches, pattern: '(?ims)\A(?!.*^\s*secret\s*:).*\Z', weight: 2 }
  - id: R16
    description: 使用 production deterministic validator 驗證 required sections、完整 command set、input vocabulary、integer layer、element metadata、closed fields 與 DAG
    assertion: shell_check
    command: >-
      node --input-type=module -e "import {readFile} from 'node:fs/promises'; import {parseSiteSystem,validateSiteSystem} from './scripts/lib/site-system.mjs'; validateSiteSystem(parseSiteSystem(await readFile(process.argv[1], 'utf8')));" {artifact}
    weight: 12
