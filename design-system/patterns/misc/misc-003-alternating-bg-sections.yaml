id: "misc-003"
name: "Alternating Background Color Sections"
category: "misc"
subcategory: "visual-technique"
tags:
  - "alternating"
  - "background"
  - "section-rhythm"
  - "divider-free"
  - "visual-separation"
quality: "reference"
version: 1

sources:
  - site: "stripe.com"
    page: "/"
    analyzed_date: 2026-07-11
    confidence: "high"
    evidence: "tokens+screenshots"

spec:
  layout:
    type: "sequential sections with alternating background colors"
    height: "auto"
    max_width: "1200px (container, consistent across all sections)"
    alignment: "center"
    padding: "64-96px (vertical, consistent across all sections)"
  typography:
    headline:
      font_family: ""
      font_size: ""
      font_weight: ""
      line_height: ""
  spacing:
    between_elements: []
    section_padding_y: ["64px", "96px"]
  colors:
    background:
      sequence:
        - "#FFFFFF (canvas/white)"
        - "#F6F9FC (canvas-soft/light blue-gray)"
        - "#FFFFFF (canvas/white)"
        - "#F5E9D4 (canvas-cream/warm cream)"
        - "#FFFFFF (canvas/white)"
    text_primary: "#0D253D (consistent across all backgrounds)"
    text_secondary: "#64748D"
    accent: "#533AFD"
    harmony: "light backgrounds only; text color remains consistent"
  effects:
    shadow: "none"
    border_radius: "0"
  animation:
    entrance: "none (background is static)"
    duration: ""
    easing: ""

structure:
  - element: "section_sequence"
    role: "page_content"
    children:
      - element: "section"
        role: "content_section"
        children:
          - element: "container"
            role: "content_wrapper"
            content_type: "section content with consistent max-width"

when_to_use:
  - "Long-form marketing pages with 5+ content sections"
  - "When you need visual separation between sections without explicit dividers"
  - "Telling a multi-part story or covering multiple distinct topics"
  - "Pages where a single continuous background feels too flat"

when_not_to_use:
  - "Short pages with only 1-3 sections (use dividers instead)"
  - "When the design calls for a single continuous background color"
  - "For dashboard or app interfaces (use cards to separate instead)"
  - "When brand colors don't include suitable light background variants"

implementation:
  css_snippet: ""
  responsive_notes:
    mobile: "Maintain same background sequence; reduce vertical padding"
    tablet: "Maintain sequence; keep padding consistent"
    desktop: "Full sequence with generous padding"
  accessibility:
    - "Ensure text contrast on all background variants (minimum 4.5:1)"
    - "Background color should not be the sole visual cue for section change"
    - "Cream (#F5E9D4) on white text may need contrast check"
    - "Use semantic section landmarks for screen reader navigation"

assets:
  screenshots: {}
  references: []
