id: "pricing-001"
name: "Three-Tier Pricing Cards with Featured Highlight"
category: "pricing"
subcategory: "3-tier-cards"
tags:
  - "cards"
  - "featured-tier"
  - "brand-dark"
  - "comparison"
quality: "reference"
version: 1

sources:
  - site: "stripe.com"
    page: "/pricing"
    analyzed_date: 2026-07-11
    confidence: "high"
    evidence: "tokens+screenshots"

spec:
  layout:
    type: "3-column horizontal card grid"
    height: "auto (equal-height cards)"
    max_width: "1200px"
    alignment: "center (cards), left (card content)"
    padding: "32px (card padding)"
  typography:
    headline:
      font_family: "Sohne"
      font_size: "22px (tier name)"
      font_weight: 300
      line_height: 1.1
    price:
      font_size: "56px"
      font_weight: 300
      line_height: 1.03
      letter_spacing: "-1.4px"
  spacing:
    between_elements:
      - "cards: 24px gap"
      - "tier_name -> price: 8px"
      - "price -> feature_list: 24px"
      - "feature items: 12px"
    section_padding_y: ["64px", "64px"]
  colors:
    background: "#FFFFFF (standard) / #1C1E54 (featured, brand-dark)"
    text_primary: "#0D253D (light) / #FFFFFF (dark featured)"
    text_secondary: "#64748D"
    accent: "#533AFD"
    harmony: "monochromatic indigo anchor; featured card in deep navy (not indigo)"
  effects:
    shadow: "none (flat cards with hairline border)"
    border_radius: "12px"
  animation:
    entrance: "fade-in slide-up"
    duration: "0.2-0.3s"
    easing: "ease-in-out"

structure:
  - element: "section"
    role: "pricing_grid"
    children:
      - element: "section_header"
        role: "context"
        children:
          - element: "eyebrow_label"
            content_type: "micro-cap text"
          - element: "heading"
            content_type: "display-xl"
          - element: "subheading"
            content_type: "body-lg"
      - element: "card_grid"
        role: "pricing_tiers"
        children:
          - element: "card"
            role: "tier"
            children:
              - element: "tier_name"
                content_type: "heading-lg"
              - element: "price"
                content_type: "tabular number display"
              - element: "feature_list"
                content_type: "icon + text items"
              - element: "cta_button"
                content_type: "filled pill button"

when_to_use:
  - "SaaS pricing pages with 3 distinct tiers"
  - "When one tier is recommended/featured and needs visual emphasis"
  - "B2B products where pricing needs to feel premium and considered"

when_not_to_use:
  - "When pricing is simple (1 or 2 tiers) - use simpler layout"
  - "When all tiers should appear equal without recommendation"
  - "Enterprise-only products without self-serve pricing"

implementation:
  css_snippet: ""
  responsive_notes:
    mobile: "Stack cards vertically, one per row"
    tablet: "2 columns (featured card spans full width or stays in-line)"
    desktop: "3 equal columns with featured card at 1x width"
  accessibility:
    - "Use proper table structure or role=list for feature comparison"
    - "Ensure featured card has distinct visual indicator beyond color alone (icon, badge, or border)"
    - "High contrast on dark card (white text on #1C1E54 = ~12:1)"
    - "Tab order: left-to-right across all tiers"

assets:
  screenshots: {}
  references: []
