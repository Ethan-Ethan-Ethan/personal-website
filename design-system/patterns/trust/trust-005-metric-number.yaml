      font-size: 26px;
      font-weight: 800;
      color: #d4a34b;
      line-height: 1;
    }
    .metric .label {
      font-size: 13px;
      color: #b9b3a5;
    }
  responsive_notes:
    mobile: "Keep same size; ensure metrics remain legible"
    tablet: "Unchanged"
    desktop: "Unchanged"
