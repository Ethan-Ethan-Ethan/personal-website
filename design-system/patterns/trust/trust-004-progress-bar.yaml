spec:
  layout:
    type: "horizontal bar with fill"
    height: "8px"
    max_width: "100%"
    alignment: "stretch"
    padding: ""
  typography:
    headline:
      font_family: ""
      font_size: ""
      font_weight: ""
      line_height: ""
    subheadline:
      font_size: ""
