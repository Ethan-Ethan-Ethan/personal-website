implementation:
  css_snippet: |
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(17, 17, 15, 0.84);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
  responsive_notes:
    mobile: "Stack navigation links vertically below brand; maintain glassmorphism"
    tablet: "Keep horizontal layout"
    desktop: "Full sticky topbar"
  accessibility:
    - "Ensure sticky topbar does not obscure content (use scroll-padding-top)"
    - "Focusable elements in topbar must be reachable via keyboard tab order"
    - "Add prefers-reduced-motion: no media query if blur animation is added"

