implementation:
  css_snippet: |
    /* Desktop: multi-column grid */
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
    }

    /* Tablet: single column */
    @media (max-width: 980px) {
      .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    /* Mobile: single column, reduced padding */
    @media (max-width: 720px) {
      .shell {
        padding: 0 12px;
      }
    }
  responsive_notes:
    mobile: "All grids collapse to 1fr; container padding reduces from 36px (calc) to 24px (calc)"
    tablet: "720px-980px — grids collapse to single column, nav stays horizontal"
    desktop: "> 980px — full multi-column layout"
  accessibility:
    - "Ensure content order in single-column layout is logical for screen readers"
    - "Do not reorder content visually using CSS grid-order"

