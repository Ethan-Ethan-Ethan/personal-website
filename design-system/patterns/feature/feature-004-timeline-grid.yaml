when_to_use:
  - "Career timeline or resume experience sections"
  - "Project history, company milestones, or chronological lists"
  - "Any paired year+content display pattern"

when_not_to_use:
  - "For cards with long descriptions (content column becomes too narrow)"
  - "When years are not the primary organizing axis"

comparisons: {}

implementation:
  css_snippet: |
    .timeline {
      display: grid;
      gap: 16px;
    }
    .timeline-item {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid #37372f;
    }
    .timeline-item:last-child {
      border-bottom: none;
    }
    .timeline-item .year {
      font-weight: 800;
      color: #d4a34b;
    }
  responsive_notes:
    mobile: "Stack year above content on very small screens, or reduce year column to 72px"
    tablet: "Keep two-column layout"
    desktop: "92px year column standard"
  accessibility:
    - "Use <time> element with datetime attribute for machine-readable dates"
    - "Ensure grid order matches visual order for screen reader navigation"

