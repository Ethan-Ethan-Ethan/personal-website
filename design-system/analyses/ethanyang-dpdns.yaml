# ============================================================
# 9. ACCESSIBILITY - a11y assessment
# ============================================================
accessibility:
  aria_usage:
    labels:
      - "aria-label on brand link, nav, aside, summary-grid, progress bars, access panels"
    labelledby:
      - "aria-labelledby on hero, all section panels, article features"
    live_regions:
      - "aria-live polite on resume-dashboard"
    button_states:
      - "aria-selected toggle on workspace-switcher"
  semantic_html:
    proper_use:
      - "header, nav, main, section with labelledby, article, aside, footer"
      - "time with datetime, dl dt dd for metadata"
    gaps:
      - "View-panel toggle is click-only (no keyboard support)"
      - "No skip-to-content link"
      - "Password form lacks proper screen reader announcements"
  focus_management:
    tab_index: "Not explicitly set (DOM order)"
    focus_visible: "Custom focus-visible on nav links and summary cards"
    keyboard_support: "Incomplete -- click-only view-panel toggling"
  color_contrast:
    primary_text_on_bg: "Passes WCAG AAA (approximately 15.5 to 1)"
    muted_text_on_bg: "Passes WCAG AAA (approximately 8.5 to 1)"
    soft_text_on_bg: "Passes WCAG AA (approximately 5.4 to 1)"
    inverse_text_on_light: "Passes WCAG AAA (approximately 12.8 to 1)"
    green_accent: "Adequate for large text and status indicators"
    amber_accent: "Adequate for emphasis numbers"
  observations:
    - "Good semantic HTML structure using proper landmark elements"
    - "Aria-labelledby consistently applied to content sections"
    - "Strong color contrast across all text-background combinations"
    - "Missing keyboard support for view-panel toggle"
    - "No skip-to-content link"
    - "No prefers-reduced-motion media query"
    - "No dark mode preference support"

