# ============================================================
# DESIGN ISSUES AND IMPROVEMENT OPPORTUNITIES
# ============================================================
issues:
  - severity: high
    area: maintainability
    description: "CSS duplicated across all 7 HTML files with identical root variables and body styles."
    suggestion: "Extract shared CSS into external stylesheet and link across all pages."

  - severity: high
    area: spacing_consistency
    description: "No systematic spacing scale. Uses arbitrary values without tokens."
    suggestion: "Define spacing tokens as CSS custom properties."

  - severity: medium
    area: accessibility
    description: "View-panel toggle click-only with no keyboard support."
    suggestion: "Add keyboard handlers or use native button elements."

  - severity: medium
    area: accessibility
    description: "No skip-to-content link."
    suggestion: "Add skip-link as first focusable element."

  - severity: medium
    area: accessibility
    description: "No prefers-reduced-motion media query."
    suggestion: "Add media query to disable motion for vestibular disorders."

  - severity: medium
    area: architecture
    description: "Panel toggling does not update URL. Back button cannot restore state."
    suggestion: "Use History API or hash-based routing."

  - severity: medium
    area: responsiveness
    description: "Container max-width varies arbitrarily across page types."
    suggestion: "Establish 2 or 3 named container widths."

  - severity: low
    area: performance
    description: "TradingView widget loads on page load without lazy loading."
    suggestion: "Use IntersectionObserver to defer widget load."

  - severity: low
    area: seo
    description: "No meta description on index page."
    suggestion: "Add meta description and Open Graph tags to all pages."

  - severity: low
    area: animation
    description: "Only one CSS transition defined. No micro-interactions."
    suggestion: "Add hover effects, button press feedback, card transitions."

  - severity: low
    area: security
    description: "Resume password protection is client-side only."
    suggestion: "Use server-side authentication (Cloudflare Access)."

  - severity: low
