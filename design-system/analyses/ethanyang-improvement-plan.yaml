# ============================================================
# 3. 具體改進建議（按優先級排序）
# ============================================================
recommendations:

  # --- 優先級 1：基礎架構 ---
  - id: "REC-01"
    priority: 1
    title: "抽取外部共用樣式表"
    problem: "CSS 在 7 個 HTML 檔中完全重複，:root 變數和 body 樣式各複製一份，修改需同步 7 處"
    reference: "所有參考網站均使用外部樣式表或 CSS-in-JS 模組化"
    solution: |
      /* 1. 建立 styles/main.css */
      /* 將所有 :root 變數、reset、body、共用元件 class 抽取至此 */
      
      /* styles/main.css */
      :root {
        --bg: #11110f;
        --panel: #1b1b18;
        --panel-2: #22221e;
        --line: #37372f;
        --text: #f3f0e8;
        --muted: #b9b3a5;
        --soft: #8f897b;
        --green: #88b56b;
        --amber: #d4a34b;
        --blue: #76a7bd;
        --red: #c46f5a;
        /* 新增 spacing tokens */
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --space-7: 48px;
        --space-8: 64px;
      }

      /* 2. 每個 HTML 檔改為： */
      /* <link rel="stylesheet" href="/styles/main.css"> */
      /* <link rel="stylesheet" href="/styles/page-specific.css"> (可選) */
    effort: "中"
    pattern_ref: null
    impact: "極高 — 所有後續改進的基礎"

  - id: "REC-02"
    priority: 2
    title: "建立系統化間距 tokens"
    problem: "21 個任意數值（0-92px），card padding 四種（18/20/22/24px），container width 四種（860-1180px），無 base unit"
    reference: "Stripe 使用 8px base unit 9 級 scale；Vercel 使用 4px base unit + rhythm rules"
    solution: |
      :root {
        /* Spacing scale (4px base) */
        --space-0: 0;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-7: 32px;
        --space-8: 48px;
        --space-9: 64px;
        --space-10: 96px;

        /* Container widths (named) */
        --container-narrow: 860px;   /* articles */
        --container-default: 1080px; /* dashboard, resume */
        --container-wide: 1180px;    /* index shell */

        /* Card padding (named) */
        --card-padding-sm: 16px;
        --card-padding-md: 20px;
        --card-padding-lg: 24px;

        /* Section spacing */
        --section-gap: 28px;
        --section-padding: 28px;
      }
    effort: "中"
    pattern_ref: null
    impact: "高 — 消除不一致，簡化後續調整"

  - id: "REC-03"
    priority: 3
    title: "建立系統化 type scale"
    problem: "字型大小分散在 12-48px 範圍，無系統化 scale，heading 大小隨頁面不一致"
    reference: "Stripe 14 級 type scale + negative letter-spacing；Vercel heading/copy/label/button 分組"
    solution: |
      :root {
        /* Type scale */
        --text-xs: 12px;
        --text-sm: 13px;
        --text-base: 14px;
        --text-md: 16px;
        --text-lg: 18px;
        --text-xl: 20px;
        --text-2xl: 24px;
        --text-3xl: 30px;
        --text-4xl: clamp(28px, 3.5vw, 42px);
        --text-5xl: clamp(32px, 4vw, 48px);

        /* Line heights */
        --leading-none: 1.0;
        --leading-tight: 1.15;
        --leading-snug: 1.35;
        --leading-normal: 1.6;
        --leading-relaxed: 1.8;

        /* Letter spacing (negative for headings) */
        --tracking-tight-1: -0.02em;  /* 4xl, 5xl */
        --tracking-tight-2: -0.01em;  /* 2xl, 3xl */
        --tracking-normal: 0em;
        --tracking-wide: 0.12em;      /* kicker, uppercase */
      }
    effort: "中"
    pattern_ref: null
    impact: "高 — 統一排版節奏"

  # --- 優先級 2：無障礙性 ---
  - id: "REC-04"
    priority: 4
    title: "加入 skip-to-content link"
    problem: "無 skip link，鍵盤用戶必須 tab 過整個導覽列才能到達主內容"
    reference: "Vercel 有 skip links；WCAG 2.1 Level A 建議"
    solution: |
      <!-- HTML: 放在 <body> 第一個子元素 -->
      <a href="#main-content" class="skip-link">跳至主要內容</a>

      /* CSS */
      .skip-link {
        position: absolute;
        top: -100%;
        left: var(--space-4);
        padding: var(--space-2) var(--space-4);
        background: var(--green);
        color: var(--bg);
        font-weight: 800;
        font-size: var(--text-sm);
        border-radius: 6px;
        z-index: 100;
        text-decoration: none;
      }
      .skip-link:focus {
        top: var(--space-2);
      }
    effort: "小"
    pattern_ref: null
    impact: "高 — 基本無障礙合規"

  - id: "REC-05"
    priority: 5
    title: "view-panel toggle 加入鍵盤支援"
    problem: "data-view-target 元素僅響應 click，鍵盤無法操作（若為 div/span 而非 button）"
    reference: "Vercel 的 focus ring pattern（2px white gap + 2px blue ring）"
    solution: |
      /* 方案 A：改用原生 <button> 元素（推薦） */
      <button data-view-target="ops" class="view-trigger"
              aria-expanded="false" aria-controls="panel-ops">
        營運概覽
      </button>

      /* 方案 B：若保留 div，加入 keyboard handler */
      /* JS */
      document.querySelectorAll('[data-view-target]').forEach(el => {
        el.setAttribute('tabindex', '0');
        el.setAttribute('role', 'button');
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            el.click();
          }
        });
      });

      /* Focus ring (Vercel-style) */
      [data-view-target]:focus-visible {
        outline: none;
        box-shadow:
          0 0 0 2px var(--bg),
          0 0 0 4px var(--green);
      }
    effort: "中"
    pattern_ref: null
    impact: "高 — 鍵盤可及性"

  - id: "REC-06"
    priority: 6
    title: "加入 prefers-reduced-motion 支援"
    problem: "smooth scroll + backdrop-filter blur 未尊重用戶的動效偏好"
    reference: "Vercel 預設 0ms，尊重 prefers-reduced-motion"
    solution: |
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
        html { scroll-behavior: auto; }
      }
    effort: "小"
    pattern_ref: null
    impact: "中 — 前庭障礙用戶友善"

  # --- 優先級 3：微互動與動效 ---
  - id: "REC-07"
    priority: 7
    title: "加入 button hover/press 過渡效果"
    problem: "按鈕無 hover/press 視覺回饋，使用者互動感受生硬"
    reference: "Stripe: bg shift (#533AFD -> #4434D4)；Vercel: gray scale progression"
    solution: |
      .btn-primary {
        background: #f0eadc;
        color: #161511;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      .btn-primary:hover {
        background: #e8e2d2;
        transform: translateY(-1px);
      }
      .btn-primary:active {
        background: #ddd7c7;
        transform: translateY(0);
      }

      .btn-secondary {
        background: rgba(255,255,255,0.06);
        color: var(--muted);
        transition: background 0.15s ease, color 0.15s ease;
      }
      .btn-secondary:hover {
        background: rgba(255,255,255,0.10);
        color: var(--text);
      }
    effort: "小"
    pattern_ref: "cta-002"
    impact: "中 — 提升互動質感"

  - id: "REC-08"
    priority: 8
    title: "加入 card hover 效果"
    problem: "卡片無 hover 狀態（僅 market-watchlist 有 transition），互動式卡片缺少視覺回饋"
    reference: "Stripe: subtle shadow increase on hover；Vercel: elevated shadow + transform"
    solution: |
      .card-interactive {
        transition:
          border-color 0.2s ease,
          background 0.2s ease,
          transform 0.15s ease;
      }
      .card-interactive:hover {
        border-color: rgba(136, 181, 107, 0.42);
        background: rgba(27, 27, 24, 0.95);
        transform: translateY(-2px);
      }
    effort: "小"
    pattern_ref: null
    impact: "中 — 提升可探索感"

  - id: "REC-09"
    priority: 9
    title: "加入 scroll-driven fade-in 動畫"
    problem: "頁面內容靜態載入，缺少漸進展示的層次感"
    reference: "Stripe: sections fade in on scroll via IntersectionObserver"
    solution: |
      /* CSS */
      .fade-in-section {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      .fade-in-section.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* JS */
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.fade-in-section').forEach(el => {
        observer.observe(el);
      });
    effort: "小"
    pattern_ref: null
    impact: "中 — 提升瀏覽體驗"

  # --- 優先級 4：品牌與轉換 ---
  - id: "REC-10"
    priority: 10
    title: "強化 hero value proposition"
    problem: "Hero 區域為資訊性 dashboard，缺少清晰的身份定位陳述"
    reference: "Stripe: 明確 value prop（'Payments infrastructure for the internet'）；Vercel: 'Agentic Infrastructure'"
    solution: |
      <!-- 在 workspace hero 加入明確定位 -->
      <div class="hero-copy">
        <p class="kicker">FAE / AI 工程 / 技術顧問</p>
        <h1>從現場到產品的橋樑工程師</h1>
        <p class="lead">
          專注 AI 工具導入與技術顧問，連結客戶需求與產品實作。
          紀錄實戰經驗、方法論、與對技術趨勢的觀察。
        </p>
        <div class="hero-actions">
          <a href="/articles/" class="btn-primary">閱讀文章</a>
          <a href="#access" class="btn-secondary">查看經歷</a>
        </div>
      </div>
    effort: "小"
    pattern_ref: "misc-002"
    impact: "高 — 第一印象與品牌定位"

  - id: "REC-11"
    priority: 11
    title: "加入聯繫方式與社交連結"
    problem: "無社交媒體連結、無聯繫表單、無 email 訂閱。轉換路徑不完整"
    reference: "Stripe: 多路徑 CTA（self-serve + sales）；NNG: newsletter signup"
    solution: |
      <!-- Footer 加入聯繫區塊 -->
      <footer>
        <div class="footer-contacts">
          <a href="mailto:your@email.com" aria-label="Email">Email</a>
          <a href="https://github.com/yourname" aria-label="GitHub">GitHub</a>
          <a href="https://linkedin.com/in/yourname" aria-label="LinkedIn">LinkedIn</a>
        </div>
      </footer>

      /* 或文章末尾加入 CTA */
      <aside class="article-cta">
        <p>對 AI 工程與技術顧問有興趣？</p>
        <a href="mailto:your@email.com" class="btn-primary">聯繫我</a>
      </aside>
    effort: "小"
    pattern_ref: "forms-001"
    impact: "高 — 完成轉換路徑"

  - id: "REC-12"
    priority: 12
    title: "加入信任信號區"
    problem: "缺少社會證明（客戶 logo、合作案例、具體數據指標）"
    reference: "NNG: 28+ years + enterprise client logos；Stripe: logo marquee + stat counters"
    solution: |
      <!-- Hero 下方加入 trust strip -->
      <section class="trust-strip" aria-label="專業經歷">
        <div class="trust-item">
          <b class="metric-number">8+</b>
          <span class="metric-label">年 FAE 經驗</span>
        </div>
        <div class="trust-item">
          <b class="metric-number">50+</b>
          <span class="metric-label">企業客戶服務</span>
        </div>
        <div class="trust-item">
          <b class="metric-number">3</b>
          <span class="metric-label">技術領域專精</span>
        </div>
      </section>
    effort: "小"
    pattern_ref: "trust-002"
    impact: "中 — 建立專業可信度"

  # --- 優先級 5：技術品質 ---
  - id: "REC-13"
    priority: 13
    title: "加入 Google Fonts Inter 載入"
    problem: "依賴本地安裝的 Inter 字體，若未安裝則 fallback 至 Arial，排版一致性無法保證"
    reference: "所有參考網站均使用自訂字體或系統字體棧的明確策略"
    solution: |
      <!-- HTML <head> 中加入 -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap"
            rel="stylesheet">
    effort: "小"
    pattern_ref: null
    impact: "中 — 排版一致性"

  - id: "REC-14"
    priority: 14
    title: "加入 Meta tags 與 Open Graph"
    problem: "index 頁面無 meta description，所有頁面缺少 OG tags，SEO 與社交分享不佳"
    reference: "所有參考網站均有完整的 meta + OG + Twitter card tags"
    solution: |
      <!-- 每個頁面的 <head> 中加入 -->
      <meta name="description" content="Ethan Yang 的技術筆記與職涯紀錄">
      <meta property="og:title" content="Ethan Yang | Personal Dashboard">
      <meta property="og:description" content="FAE 實戰經驗、AI 工作方法論、技術觀察">
      <meta property="og:type" content="website">
      <meta property="og:url" content="https://ethanyang.dpdns.org">
      <meta name="twitter:card" content="summary_large_image">
    effort: "小"
    pattern_ref: null
    impact: "中 — SEO 與社交分享"

  - id: "REC-15"
    priority: 15
    title: "view-panel toggle 加入 URL 狀態"
    problem: "panel 切換不更新 URL，重新整理或按返回鍵無法恢復狀態"
    reference: "所有 SPA-like 網站均使用 History API 或 hash routing"
    solution: |
      /* JS: 使用 History API */
      function showPanel(panelId) {
        // 現有 panel toggle 邏輯...
        history.pushState({ panel: panelId }, '', '#' + panelId);
      }

      window.addEventListener('popstate', (e) => {
        const panel = e.state?.panel;
        if (panel) showPanel(panel);
      });

      /* 初始化：從 URL hash 恢復狀態 */
      const initialPanel = location.hash.slice(1);
      if (initialPanel) showPanel(initialPanel);
    effort: "中"
    pattern_ref: null
    impact: "中 — 可分享性與瀏覽體驗"

  - id: "REC-16"
    priority: 16
    title: "統一 container max-width 為命名寬度"
    problem: "container width 隨頁面類型任意變化（860/1040/1080/1180px），缺乏規則"
    reference: "Stripe: 1200px 統一 container；Vercel: 1200px max content column"
    solution: |
      :root {
        --container-sm: 860px;   /* 文章內文 */
        --container-md: 1080px;  /* 一般頁面 */
        --container-lg: 1180px;  /* dashboard shell */
      }
      .shell { max-width: var(--container-lg); }
      .shell--article { max-width: var(--container-sm); }
      .shell--default { max-width: var(--container-md); }
    effort: "小"
    pattern_ref: null
    impact: "中 — 視覺一致性"

  - id: "REC-17"
    priority: 17
    title: "加入色彩系統變體"
    problem: "每個 accent color 僅有單一值，缺少 hover/pressed/disabled/subtle 變體"
    reference: "Stripe 每色 4+ 變體（primary/press/deep/soft/bg-subdued）；Vercel 10 步色階"
    solution: |
      :root {
        /* 現有 */
        --green: #88b56b;
        --amber: #d4a34b;
        --blue: #76a7bd;
        --red: #c46f5a;

        /* 新增變體 */
        --green-hover: #7aa65d;
        --green-subtle: rgba(136, 181, 107, 0.12);
        --green-muted: rgba(136, 181, 107, 0.28);

        --amber-hover: #c49443;
        --amber-subtle: rgba(212, 163, 75, 0.08);

        --blue-hover: #6898ae;
        --blue-subtle: rgba(118, 167, 189, 0.10);

        --red-hover: #b5614d;
      }
    effort: "小"
    pattern_ref: null
    impact: "中 — 互動狀態完整性"

  - id: "REC-18"
    priority: 18
    title: "TradingView widget 延遲載入"
    problem: "TradingView widget 在頁面載入時即注入 script，影響初始載入效能"
    reference: "Vercel: 延遲載入非關鍵資源"
    solution: |
      /* JS: IntersectionObserver lazy load */
      const chartContainer = document.querySelector('.tradingview-container');
      const chartObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          loadTradingViewWidget();
          chartObserver.disconnect();
        }
      }, { rootMargin: '200px' });
      chartObserver.observe(chartContainer);
    effort: "小"
    pattern_ref: null
    impact: "低 — 效能改善"

