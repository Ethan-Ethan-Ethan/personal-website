# 個人網站改進計畫
# ethanyang.dpdns.org 跨網站比較與改善建議
generated_date: 2026-07-11
personal_site: ethanyang.dpdns.org
reference_sites:
  - stripe.com
  - vercel.com
  - nngroup.com
  - linear.app

# ============================================================
# 1. 跨網站比較
# ============================================================
comparisons:

  color_system:
    personal_site:
      maturity: "中等"
      description: "11 個 CSS 自定義屬性，語義化命名，暗色主題一致性高"
      strengths:
        - "暖橄欖色調（非純灰），品牌識別度高"
        - "對比度通過 WCAG AAA（主文字 ~15.5:1）"
        - "四色語義系統：green=健康、amber=指標、blue=分類、red=錯誤"
      weaknesses:
        - "缺少系統化的色階（每色僅 1 個值，無 hover/pressed/disabled 變體）"
        - "大量 literal rgba 值未收斂到 CSS 變數"
        - "無亮色主題支援"
    stripe:
      maturity: "高"
      description: "完整品牌色階 + 語義色 + 裝飾色，每色含 press/deep/soft/bg-subdued 變體"
      key_pattern: "單一 Indigo 品牌錨點 + pastel gradient mesh 簽名視覺"
    vercel:
      maturity: "最高"
      description: "Geist Design System：10 步色階（100-1000）+ 完整 gray-alpha 通道 + 語義色 + 暗/亮雙主題"
      key_pattern: "Color conveys information, not decoration；每步色階有明確定義的用途"
    gap_analysis:
      - "個人網站缺少 accent color 的 hover/pressed 狀態變體"
      - "literal rgba 值（overlay、backdrop）未收斂到 design tokens"
      - "無 prefers-color-scheme 支援"
      - "色階粒度不足（stripe 每色 4+ 變體，vercel 10 步，個人網站每色僅 1）"

  spacing_system:
    personal_site:
      maturity: "低"
      description: "21 個不規則數值（0-92px），無 token 命名，無系統化 scale"
      strengths:
        - "視覺上舒適，間距大致合理"
      weaknesses:
        - "無 base unit（混用 2px/4px/6px/8px 增量）"
        - "card padding 不一致：18px/20px/22px/24px 四種"
        - "container max-width 隨頁面類型任意變化：1180/1080/1040/860px"
        - "所有值為 literal CSS，無 custom properties"
    stripe:
      maturity: "高"
      description: "8px base unit，9 級 token（xxs:2px 到 huge:64px），命名語義化"
    vercel:
      maturity: "最高"
      description: "4px base unit，完整 scale 映射，rhythm rules 明確定義（group 內 8px、group 間 16px、section 間 32-40px）"
    gap_analysis:
      - "個人網站需要定義 4px 或 8px base unit 並建立 token scale"
      - "card padding 應統一為 2-3 個命名尺寸（sm/md/lg）"
      - "container width 應收斂為 2-3 個命名寬度"

  typography_system:
    personal_site:
      maturity: "中等"
      description: "Inter 字體選擇佳，clamp() 響應式，line-height 細緻調校（1.0-1.9）"
      strengths:
        - "中文字體 fallback 鏈完善（Noto Sans TC -> PingFang TC -> Microsoft JhengHei）"
        - "font-weight 800 統一用於標籤/按鈕/狀態"
        - "使用 clamp() 實現 h1 響應式"
      weaknesses:
        - "無 @font-face 或 Google Fonts 載入，依賴本地安裝"
        - "h1 大小在不同頁面不一致（28-48px 範圍）"
        - "無系統化 type scale（大小值分散）"
        - "letter-spacing 僅在 kicker 使用"
    stripe:
      maturity: "最高"
      description: "Sohne 品牌字體 + 14 級 type scale + negative letter-spacing 簽名 + tnum 數字特性"
      key_pattern: "weight 300 + 負 letter-spacing（-1.4px at 56px）創造高端感"
    vercel:
      maturity: "最高"
      description: "Geist Sans/Mono + 完整 heading/copy/label/button 分組 + 激進負 letter-spacing"
      key_pattern: "每級 size 都有精確的 letter-spacing（-6% ratio），tnum tabular numerals"
    gap_analysis:
      - "個人網站應加入 Google Fonts Inter 載入（含 display=swap）"
      - "應定義 8-10 級 type scale tokens"
      - "heading 的 letter-spacing 應系統化（大標題負值，小文字正值或 0）"
      - "數字應考慮 tnum font-feature"

  component_reusability:
    personal_site:
      maturity: "低"
      description: "~20 種元件，樣式一致但 CSS 未抽取為可複用 class"
      strengths:
        - "card 變體共享 border/radius/background 基礎"
        - "kicker pattern 跨 7 個 HTML 檔一致"
      weaknesses:
        - "CSS 在 7 個 HTML 檔中完全重複（:root + body 樣式）"
        - "無外部樣式表"
        - "元件未抽取為獨立 class（inline 定義）"
        - "無元件狀態系統（loading/error/empty）"
    stripe:
      maturity: "高"
      description: "完整元件規格（button 4 variants x 2 sizes、card 5 types、form states）"
    vercel:
      maturity: "最高"
      description: "Geist Design System 開源，完整 shadow stack + border-radius tokens + 狀態系統"
    gap_analysis:
      - "最關鍵：抽取 shared CSS 為外部樣式表"
      - "定義元件 class 命名系統（BEM 或 utility-first）"
      - "加入元件狀態變體（hover/active/disabled/loading/error）"

  accessibility:
    personal_site:
      maturity: "中等偏上"
      description: "語義 HTML 良好，ARIA 使用到位，對比度 AAA"
      strengths:
        - "aria-labelledby 一致應用於所有 section"
        - "aria-live polite 用於動態區域"
        - "所有文字-背景對比通過 WCAG AA/AAA"
        - "semantic HTML landmarks（header/nav/main/section/article/aside/footer）"
      weaknesses:
        - "view-panel toggle 僅支援 click，無鍵盤導航"
        - "無 skip-to-content link"
        - "無 prefers-reduced-motion 媒體查詢"
        - "無 prefers-color-scheme 支援"
    stripe:
      maturity: "高"
      description: "邏輯 tab order、focus visible、heading hierarchy、descriptive alt text"
    vercel:
      maturity: "最高"
      description: "自訂 focus ring（2px white + 2px blue）、color never sole indicator、skip links"
    gap_analysis:
      - "加入 skip-to-content link（最高優先）"
      - "view-panel toggle 加入 keyboard handler（Enter/Space）"
      - "加入 @media (prefers-reduced-motion: reduce)"
      - "借鑒 Vercel 的 focus ring pattern"

  brand_consistency:
    personal_site:
      maturity: "中等"
      description: "暗色 dashboard 美學一致，warm olive 色調有品牌識別"
      strengths:
        - "Dashboard metaphor 貫穿全站（status indicators, progress bars, metrics）"
        - "warm olive 色調有別於通用 dark theme"
        - "kicker pattern 統一"
      weaknesses:
        - "brand mark 僅 EY 文字方框，識別度有限"
        - "無明確 tagline 或 value proposition"
        - "hero 區域缺乏清晰的定位陳述"
    stripe:
      maturity: "最高"
      description: "Indigo + gradient mesh + thin type + pill buttons = 即時可識別"
    gap_analysis:
      - "需要更強的品牌定位語句"
      - "brand mark 可考慮加入圖形元素"
      - "缺少信任信號（參考 NNG 的 experience badge + client logos）"

  animation_and_motion:
    personal_site:
      maturity: "低"
      description: "全站僅 1 個 CSS transition，無微互動"
      weaknesses:
        - "無 button hover/press 效果"
        - "無 card hover 效果"
        - "無 scroll-driven animations"
        - "無 loading/skeleton states"
        - "smooth scroll 是唯一動效"
    stripe:
      maturity: "高"
      description: "0.2-0.3s transitions、hover shadow increase、scroll fade-in、logo marquee"
    vercel:
      maturity: "高"
      description: "150ms default、overshoot spring easing、animated glow backgrounds"
    gap_analysis:
      - "加入 button/card hover 過渡效果"
      - "加入 scroll-driven fade-in（IntersectionObserver）"
      - "加入 prefers-reduced-motion 支援"

