  key_strengths_to_preserve:
    - "暖橄欖色調暗色主題 — 品牌識別度高"
    - "Dashboard metaphor — 個人風格強烈"
    - "語義 HTML + ARIA — 無障礙基礎良好"
    - "Inter 字體選擇 — 技術內容友善"
  biggest_gaps_vs_reference:
    - "無外部樣式表（所有參考網站均有模組化 CSS 架構）"
    - "無系統化 spacing/type scale（Stripe/Vercel 均有完整 token 系統）"
    - "動效幾乎為零（參考網站均有完整的 hover/transition/scroll 動畫）"
    - "缺少信任信號與轉換路徑（Stripe/NNG 在信任建構上遠超個人網站）"
  success_metrics:
    - "CSS 重複度：7 份 -> 1 份（REC-01）"
    - "Lighthouse Performance score：目標 > 90"
    - "Lighthouse Accessibility score：目標 100"
    - "Core Web Vitals：LCP < 2.5s, CLS < 0.1"
