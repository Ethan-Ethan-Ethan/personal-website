meta:
  domain: vercel.com
  analyzed_date: '2026-07-11'
  url: https://vercel.com
  design_system: Geist Design System (open-source)
  total_sections_on_homepage: 8
  theme_support: dark + light (system preference detection)
layout:
  hero:
    concept: Agentic Infrastructure
    structure:
    - type: background_glow
      variants:
      - fallback-dark-glow-mobile
      - fallback-dark-glow-desktop
      - fallback-light-glow-mobile
      - fallback-light-glow-desktop
    - type: headline
      text: Agentic Infrastructure
    - type: subheadline
      text: To ship apps and agents
    - type: cta_group
      buttons:
      - Deploy Now
      - Talk to Sales
    height: 100vh (approx. full viewport)
    padding: large (80-120px top/bottom estimated)
    alignment: center
  grid:
    system: flexbox + CSS Grid hybrid
    columns: variable (1-4 column layouts)
    container_max_width: 1200px (max content column)
    card_grid: 3-column grid for feature cards
  section_spacing:
    between_sections: 96px-192px (24-48 spacing units on 4px grid)
    content_padding: 24-32px side padding on mobile, auto-centering on desktop
  responsive:
    breakpoints:
      sm: 401px
      md: 601px
      lg: 961px
      xl: 1200px
      2xl: 1400px
    desktop: '> 961px'
    tablet: 601px - 960px
    mobile: < 600px
  section_structure_top_to_bottom:
  - section: Hero
    headline: Agentic Infrastructure
  - section: Feature Section 1
    headline: Build agents on infrastructure that thinks like them
    subfeatures:
    - Durable Orchestration
    - Sandboxed Environments
    - AI Model Gateway
    - Fluid Compute
    customer_showcase: Notion - powers millions of agent conversations daily on Vercel
  - section: Feature Section 2
    headline: Ship apps that scale from zero to millions instantly
    subfeatures:
    - Global Delivery
    - Deployment Environments
    - Serverless Functions
    - Web Application Firewall
    customer_showcase: Zapier - serves over 100 million monthly website visits
  - section: Feature Section 3
    headline: Host platforms that serve every customer
    subfeatures:
    - Tenant Isolation
    - Domain Management
    - Custom SSL Certificates
    - Preview URLs
    customer_showcase: Mintlify - powers documentation for 20,000+ companies
  - section: Recently Shipped
    cards:
    - Eve framework
    - Passport
    - Containers (Dockerfile support)
  - section: Final CTA
    headline: Built by you, or your agents
    action: Deploy button + npx plugins add vercel/vercel-plugin
  - section: Footer
    columns: 12
spacing:
  base_unit: 4px
  scale:
  - 1
  - 2
  - 3
  - 4
  - 6
  - 8
  - 10
  - 16
  - 24
  scale_values_px:
  - 4
  - 8
  - 12
  - 16
  - 24
  - 32
  - 40
  - 64
  - 96
  extended_values_px:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 8
  - 10
  - 12
  - 14
  - 16
  - 32
  - 36
  - 40
  - 48
  - 64
  - 80
  - 96
  - 120
  - 128
  - 160
  - 192
  consistency: high
  whitespace_ratio: generous
  rhythm_rules:
    inside_group: 8px
    between_groups: 16px
    between_sections: 32-40px
    hero_padding: 80-120px
  card_padding:
    standard: 24px
    compact: 16px
    hero: 32px
color:
  system_name: Geist Design System Colors
  primary: '#171717'
  secondary: '#4d4d4d'
  accent_blue: '#006bff'
  neutral:
    background_100: '#ffffff'
    background_200: '#fafafa'
    text_primary: '#171717'
    text_secondary: '#4d4d4d'
    text_tertiary: '#7d7d7d'
    text_placeholder: '#a8a8a8'
    border_default: '#ebebeb'
    border_strong: '#c9c9c9'
    divider: '#eaeaea'
  gray_scale:
    '100': '#f2f2f2'
    '200': '#ebebeb'
    '300': '#e6e6e6'
    '400': '#eaeaea'
    '500': '#c9c9c9'
    '600': '#a8a8a8'
    '700': '#8f8f8f'
    '800': '#7d7d7d'
    '900': '#4d4d4d'
    '1000': '#171717'
  gray_alpha:
    '100': '#0000000d'
    '200': '#00000015'
    '300': '#0000001a'
    '400': '#00000014'
    '500': '#00000036'
    '600': '#0000003d'
    '700': '#00000070'
    '800': '#00000082'
    '900': '#000000b3'
    '1000': '#000000e8'
  semantic_colors:
    link: '#006bff'
    info: '#006bff'
    success: '#28a948'
    warning: '#ffae00'
    error: '#fc0035'
    danger: '#ea001d'
    focus_ring: '#006bff'
  workflow_accent_colors:
    develop: '#0a72ef'
    preview: '#de1d8d'
    ship: '#ff5b4f'
    console_blue: '#0070f3'
    console_purple: '#7928ca'
    console_pink: '#eb367f'
  dark_mode:
    background: '#000000'
    background_elevated: '#0a0a0a'
    foreground: '#ededed'
    foreground_muted: '#888888'
    border: rgba(255,255,255,0.08)
    border_strong: rgba(255,255,255,0.14)
  harmony: monochromatic + single accent (blue)
  contrast_ratio: 'high (WCAG AA: 4.5:1 minimum)'
  philosophy: Color conveys information, not decoration
typography:
  font_family:
    heading: Geist Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif
    body: Geist Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif
    mono: Geist Mono, ui-monospace, SFMono-Regular, 'Roboto Mono', Menlo, Monaco, 'Cascadia Code', monospace
  open_type_features: liga (enabled globally), tnum (tabular numbers)
  font_weights:
    regular: 400
    medium: 500
    semibold: 600
  headings:
  - token: heading-72
    size: 72px
    line_height: 72px
    letter_spacing: -4.32px
    weight: 600
  - token: heading-64
    size: 64px
    line_height: 64px
    letter_spacing: -3.84px
    weight: 600
  - token: heading-56
    size: 56px
    line_height: 56px
    letter_spacing: -3.36px
    weight: 600
  - token: heading-48
    size: 48px
    line_height: 56px
    letter_spacing: -2.88px
    weight: 600
  - token: heading-40
    size: 40px
    line_height: 48px
    letter_spacing: -2.40px
    weight: 600
  - token: heading-32
    size: 32px
    line_height: 40px
    letter_spacing: -1.28px
    weight: 600
  - token: heading-24
    size: 24px
    line_height: 32px
    letter_spacing: -0.96px
    weight: 600
  - token: heading-20
    size: 20px
    line_height: 26px
    letter_spacing: -0.40px
    weight: 600
